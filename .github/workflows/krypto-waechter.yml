name: Krypto-Wächter für Windows bauen

on:
  push:
    paths:
      - "krypto-waechter/**"
      - ".github/workflows/krypto-waechter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Tests und EXE (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: krypto-waechter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: PyInstaller installieren
        run: python -m pip install pyinstaller

      - name: EXE bauen
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Krypto-Waechter
          --icon krypto_waechter/assets/krypto-waechter.ico
          --add-data "krypto_waechter/assets;krypto_waechter/assets"
          Krypto-Waechter.pyw

      - name: EXE-Selbsttest
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "kw"
          $proc = Start-Process -FilePath dist/Krypto-Waechter.exe -ArgumentList "--selbsttest", "--config", "$log\config.json" -Wait -PassThru
          Get-Content "$log\krypto-waechter.log" -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "Selbsttest der EXE fehlgeschlagen (Exit-Code $($proc.ExitCode))" }

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paket | Out-Null
          Copy-Item dist/Krypto-Waechter.exe paket/
          Copy-Item README.md paket/ANLEITUNG.md

      - uses: actions/upload-artifact@v5
        with:
          name: Krypto-Waechter-Windows
          path: krypto-waechter/paket/
          if-no-files-found: error
